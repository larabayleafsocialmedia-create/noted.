<style>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tstr=d=>d.toLocaleDateString('sv-SE'),today=()=>tstr(new Date());
const COL=['#B46A72','#E49AAE','#A8B58A','#6F8458','#A9B7C6','#5D7690','#D9A87C','#C98F86','#8E7AA8','#6AA6A0','#CDB17A','#9A8F86'];
const DEF=['Biologie','Chemie','Deutsch','Englisch','Erdkunde','Ethik','Französisch','Geschichte','Informatik','Kunst','Latein','Mathematik','Musik','Physik','Politik','Religion','Spanisch','Sport','Wirtschaft'];
const KEYS=['aufgaben','pruefungen','termine','notizen','dateien','news','ziele','karten'];
let S={prof:{n:'',k:'',s:'',l:'DE'},pin:'',theme:'',sub:DEF.map((n,i)=>({id:i+1,n,c:COL[i%12],on:0})),d:{},sy:'DE-P',gr:[],pl:{A:{},B:{}},swap:0,mp:{c:'Abi',b:[]},fo:{},fs:{},xp:0,dy:[],goal:60,cd:{n:'',d:''},leg:{n:'',a:'',e:''},rem:0};
try{const r=JSON.parse(localStorage.getItem('noted1'));if(r)Object.assign(S,r)}catch(e){}
S.d=S.d||{};KEYS.forEach(k=>S.d[k]=S.d[k]||[]);
const save=()=>{try{localStorage.setItem('noted1',JSON.stringify(S))}catch(e){}};
document.documentElement.dataset.theme=S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'lagoon':'blush');
const sb=id=>S.sub.find(s=>s.id==id),AS=()=>S.sub.filter(s=>s.on);
const dot=id=>`<span class="dot" style="background:${sb(id)?sb(id).c:'var(--line)'}"></span>`,sn=id=>sb(id)?esc(sb(id).n):'';
const colOf=n=>{const s=S.sub.find(s=>s.n==n);return s?s.c:''};
const sopt=none=>(none?'<option value="">Kein Fach</option>':'')+(AS().map(s=>`<option value="${s.id}">${esc(s.n)}</option>`).join('')||(none?'':'<option value="">Fächer in Einstellungen aktivieren</option>'));
const no=t=>`<p class="mut">${t}</p>`,hd=(t,s)=>`<div class="ph"><h2>${t}</h2>${s?`<p class="mut">${s}</p>`:''}</div>`;
const dd=d=>d?new Date(d+'T00:00').toLocaleDateString('de-DE',{day:'numeric',month:'short'}):'';
const diff=d=>Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);
const rel=n=>n<0?'vorbei':n==0?'heute':n==1?'morgen':'in '+n+' Tagen';
const pb=p=>`<div class="pb"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const ring=(p,t,s)=>{const r=44,c=2*Math.PI*r;return `<div class="rg"><svg viewBox="0 0 110 110" width="104" height="104" role="img" aria-label="${esc(t)}"><circle cx="55" cy="55" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="9"/><circle cx="55" cy="55" r="${r}" fill="none" style="stroke:var(--ac)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*Math.min(1,p)} ${c}" transform="rotate(-90 55 55)"/><text x="55" y="61" text-anchor="middle" font-size="20" font-weight="600" style="fill:var(--ink)">${t}</text></svg><div class="mut">${s}</div></div>`};
/* Punkte, Serie */
function pts(x,k){S.xp+=x;const d=today();if(!S.dy.includes(d))S.dy.push(d);save()}
function streak(){let n=0,d=new Date();if(!S.dy.includes(today()))d.setDate(d.getDate()-1);while(S.dy.includes(tstr(d))){n++;d.setDate(d.getDate()-1)}return n}
function maxStreak(){const a=[...new Set(S.dy)].sort();let m=0,c=0,p=null;a.forEach(x=>{c=p&&diff2(p,x)==1?c+1:1;m=Math.max(m,c);p=x});return m}
const diff2=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
function wnum(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);return Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7)}
const wk=d=>((wnum(d)+S.swap)%2?'A':'B');
function dayPlan(d){const c=(d.getDay()+6)%7;if(c>4)return null;const w=wk(d),l=[];for(let r=1;r<=9;r++){const v=S.pl[w][c+'-'+r];if(v)l.push([r,v])}return l}
const pl=l=>l.map(x=>`<div class="it"><span class="dot" style="background:${colOf(x[1])||'var(--line)'}"></span><div class="gr"><b>${esc(x[1])}</b></div><span class="mut">${x[0]}. Std.</span></div>`).join('');
/* Notensystem */
const SY={'DE-P':['Deutschland Oberstufe: Punkte 0–15',0,15,1],'DE-N':['Deutschland: Noten 1–6',1,6,0],'AT-N':['Österreich: Noten 1–5',1,5,0],'AT-P':['Österreich: Prozent 0–100',0,100,1],'CH-N':['Schweiz: Noten 1–6 (6 ist die beste)',1,6,1],'CH-P':['Schweiz: Prozent 0–100',0,100,1]};
const f2=v=>v.toFixed(2).replace('.',',');
const wav=a=>a.reduce((s,x)=>s+x.v*x.w,0)/a.reduce((s,x)=>s+x.w,0);
function gStats(){const by={};S.gr.filter(x=>x.y==S.sy).forEach(x=>(by[x.s]=by[x.s]||[]).push(x));const subs=Object.keys(by).map(i=>({id:i,avg:wav(by[i]),n:by[i].length,l:by[i]}));return{subs,avg:subs.length?subs.reduce((s,x)=>s+x.avg,0)/subs.length:null}}
/* Kalender */
const CAT={Schule:'var(--c1)',Privat:'var(--c2)',Arbeit:'var(--c3)'};
let cal={y:new Date().getFullYear(),m:new Date().getMonth(),sel:today()};
const evs=()=>[...S.d.termine.filter(e=>e.u).map(e=>({d:e.u,t:e.t,c:e.c||'Schule',z:e.z})),...S.d.pruefungen.filter(e=>e.u).map(e=>({d:e.u,t:e.t,c:'Schule',pr:1}))];
function calHTML(){const f=new Date(cal.y,cal.m,1),off=(f.getDay()+6)%7,n=new Date(cal.y,cal.m+1,0).getDate(),E=evs();
 let h=`<div class="ch"><button class="ic" data-cal="-1" aria-label="Voriger Monat">‹</button><h3>${f.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</h3><button class="ic" data-cal="1" aria-label="Nächster Monat">›</button></div><div class="cg">`+['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<i>${d}</i>`).join('');
 for(let i=0;i<off;i++)h+='<span></span>';
 for(let d=1;d<=n;d++){const k=`${cal.y}-${String(cal.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,e=E.filter(x=>x.d==k);
  h+=`<button class="cd ${k==today()?'td':''} ${k==cal.sel?'sl':''}" data-day="${k}" aria-label="${d}. ${f.toLocaleDateString('de-DE',{month:'long'})}"><span>${d}</span><em>${e.slice(0,3).map(x=>`<u style="background:${CAT[x.c]||CAT.Schule}"></u>`).join('')}</em></button>`}
 h+='</div><div class="lg">'+Object.keys(CAT).map(c=>`<span><u style="background:${CAT[c]}"></u>${c}</span>`).join('')+'</div>';
 const L=E.filter(x=>x.d==cal.sel);
 return h+`<h4>${dd(cal.sel)}</h4>`+(L.length?L.map(x=>`<div class="it"><u class="b" style="background:${CAT[x.c]||CAT.Schule}"></u><div class="gr"><b>${esc(x.t)}</b></div><span class="mut">${x.pr?'Prüfung':esc(x.z||x.c)}</span></div>`).join(''):no('Keine Termine an diesem Tag.'))}
/* Sammlungen (generisch) */
const C={
 aufgaben:{n:'Aufgabe',f:[['t','Titel','text'],['s','Fach','sub'],['u','Fällig am','date'],['a','Art','sel','Hausaufgabe|Lernaufgabe']],chk:1,xp:10},
 pruefungen:{n:'Prüfung',f:[['t','Titel','text'],['s','Fach','sub'],['u','Datum','date'],['a','Art','sel','Klausur|Test|Abitur|Mündlich']],cd:1,req:1},
 termine:{n:'Termin',f:[['t','Titel','text'],['u','Datum','date'],['c','Kategorie','sel','Schule|Privat|Arbeit'],['z','Uhrzeit','time']],req:1},
 notizen:{n:'Notiz',f:[['t','Titel','text'],['s','Fach','sub'],['x','Inhalt','area']],chk:1,xp:15,fav:1,pg:'notizen'},
 dateien:{n:'Link',f:[['t','Name','text'],['x','Link (https://…)','text'],['s','Fach','sub']],fav:1,pg:'dateien'},
 news:{n:'News',f:[['t','Titel','text'],['u','Datum','date'],['x','Text','area']],fav:1,pg:'news'},
 ziele:{n:'Lernziel',f:[['t','Ziel','text'],['s','Fach','sub'],['u','Bis','date']],chk:1,xp:20},
 karten:{n:'Karte',f:[['t','Frage','text'],['s','Fach','sub'],['x','Antwort','text']]}
};
